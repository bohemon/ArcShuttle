[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "parxtract"
dynamic = ["version"]
description = "Safely extract independent archives in parallel with 7-Zip"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "parxtract contributors" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
parxtract = "parxtract.cli:main"

[tool.hatch.version]
path = "src/parxtract/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/powershell",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parxtract"]

[tool.hatch.build.targets.wheel.force-include]
"powershell/Parxtract.psm1" = "parxtract/powershell/Parxtract.psm1"
"docs/COMMAND_MANUAL.en.md" = "parxtract/docs/COMMAND_MANUAL.en.md"
"docs/COMMAND_MANUAL.ja.md" = "parxtract/docs/COMMAND_MANUAL.ja.md"

[tool.hatch.envs.default]
dependencies = [
  "pytest>=8",
  "pytest-timeout>=2.4",
  "ruff>=0.16.1",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-verbose = "pytest -vv {args:tests}"
lint = "ruff check {args:.}"
format = "ruff check --fix {args:.} && ruff format {args:.}"
format-check = "ruff format --check {args:.}"
check = [
  "ruff check .",
  "ruff format --check .",
  "pytest tests",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]
timeout = 30
timeout_method = "thread"
session_timeout = 180

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
