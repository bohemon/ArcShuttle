name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install hatch
      - run: hatch run lint
      - run: hatch run format-check
      - run: hatch run test
      - run: hatch build
      - name: Import PowerShell module
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Import-Module ./powershell/Parxtract.psm1 -Force
          Get-Command Invoke-ParxtractPlan, Invoke-ParxtractRun, Invoke-Parxtract
