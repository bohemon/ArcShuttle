name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install hatch
      - run: hatch run lint
      - run: hatch run format-check
      - run: hatch run test
      - run: hatch build
      - name: Build PowerShell Release assets
        if: matrix.python-version == '3.12'
        run: hatch run powershell-assets
      - name: Verify clean wheel installation
        if: matrix.python-version == '3.12'
        run: hatch run verify-release --skip-build
      - name: Import PowerShell module
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Test-ModuleManifest ./powershell/ArcShuttle.psd1
          Import-Module ./powershell/ArcShuttle.psd1 -Force
          Get-Command Invoke-ArcShuttleExtractPlan, Invoke-ArcShuttleCreatePlan, Invoke-ArcShuttleRun, Invoke-ArcShuttleExtract, Invoke-ArcShuttleCreate
          Test-ModuleManifest ./powershell/Parxtract.psd1
          Import-Module ./powershell/Parxtract.psd1 -Force
          Get-Command Invoke-ParxtractPlan, Invoke-ParxtractRun, Invoke-Parxtract

  required:
    name: required
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix
        shell: bash
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "The test matrix did not succeed: ${{ needs.test.result }}" >&2
            exit 1
          fi
